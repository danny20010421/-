<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlayCanvas 測試：風車村（精緻版）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#8fc7ea;font-family:system-ui,"Noto Sans TC",sans-serif;touch-action:none;user-select:none}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));padding:8px 12px;border-radius:10px;background:rgba(6,18,30,.72);color:#e8f0f8;font-size:13px;line-height:1.6;pointer-events:auto}
  #hud b{color:#ffd26c;font-size:18px}
  #hud button{margin:4px 4px 0 0;padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:#1f4a6a;color:#fff;font-size:12px}
  #hud button.on{background:#c9973a;color:#231400}
  #tip{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:6px 14px;border-radius:99px;background:rgba(6,18,30,.6);color:#fff;font-size:13px;white-space:nowrap}
  #err{position:fixed;inset:0;display:none;place-items:center;background:#0a1a2e;color:#fff;padding:24px;text-align:center;line-height:1.8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">FPS <b id="fps">--</b>・繪製 <span id="dc">--</span><br><span id="info">載入引擎中…</span><br>
  <button id="bShadow" class="on">陰影</button><button id="bRes" class="on">高解析</button><button id="bBack">回遊戲</button></div>
<div id="tip">WASD／方向鍵移動・手機：按住畫面拖曳移動</div>
<div id="err"></div>
<script>
